name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The dogfood scenario runs this on its throwaway branch to compare
  # GitHub's runners with Tentmaker on the same commit.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Keep LF endings on Windows so gofmt and the shell scripts see the real files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go test ./...
          else
            go test -race ./...
          fi

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build every target
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch go build ./... || exit 1
            done
          done
      - name: release archives
        run: |
          scripts/build.sh 0.0.0-ci
          cd dist && sha256sum -c SHA256SUMS
          set -- tentmaker_*
          test "$#" -eq 6

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version && shellcheck scripts/*.sh

  install-sh:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-install.sh

  install-ps1:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build tentmaker.exe
        shell: bash
        run: CGO_ENABLED=0 go build -ldflags "-X github.com/baney75/tentmaker/internal/cli.Version=0.0.0-ci" -o "$RUNNER_TEMP/tentmaker.exe" ./cmd/tentmaker
      - name: test install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1 -Binary "$env:RUNNER_TEMP\tentmaker.exe" -Expect "tentmaker 0.0.0-ci"
      - name: test install.ps1 under PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1 -Binary "$env:RUNNER_TEMP\tentmaker.exe" -Expect "tentmaker 0.0.0-ci"
