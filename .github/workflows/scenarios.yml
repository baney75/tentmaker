# Real-host scenarios: what a solo developer needs from Tentmaker, measured
# on GitHub's throwaway runners (root or Administrator). Each job installs a
# build of this commit from a fake release with the real installer, connects
# with this workflow's GITHUB_TOKEN, runs checks mode against throwaway
# branches (tm-scn/<run>/...), and writes metrics/<scenario>-<os>.json.
# Each script in test/scenarios says what it asserts.
name: scenarios

on:
  push:
    branches: [test/scenarios, main]
  workflow_dispatch:

# contents: write pushes and deletes the throwaway branches; statuses: write
# is what Tentmaker posts; actions: write lets dogfood run ci.yml on its
# branch through workflow_dispatch.
permissions:
  contents: write
  statuses: write
  pull-requests: read
  actions: write

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: ${{ matrix.scenario }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [quickstart, busy-queue, failures, chaos, dogfood, upgrade]
        os: [ubuntu-latest, windows-latest]
        exclude:
          # dogfood runs ci.yml's Linux jobs; Windows has no second Go
          # toolchain story yet (see the README).
          - scenario: dogfood
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.scenario == 'dogfood' && 75 || 45 }}
    defaults:
      run:
        shell: bash
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # LF endings on Windows, so the scripts and templates are the real files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: ${{ matrix.scenario }}
        run: bash test/scenarios/${{ matrix.scenario }}.sh
      - name: upload metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-${{ matrix.scenario }}-${{ matrix.os }}
          path: metrics/
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: metrics-*
          path: metrics
          merge-multiple: true
      - name: table
        run: |
          set -o pipefail
          python3 test/scenarios/summary.py metrics \
            quickstart-linux busy-queue-linux failures-linux chaos-linux dogfood-linux upgrade-linux \
            quickstart-windows busy-queue-windows failures-windows chaos-windows upgrade-windows |
            tee -a "$GITHUB_STEP_SUMMARY"

  # The scenarios delete their branches; this catches the ones a killed job
  # left, from this run or any finished run.
  cleanup:
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: delete throwaway branches
        run: |
          refs=$(timeout 30 gh api "repos/$REPO/git/matching-refs/heads/tm-scn/" --paginate --jq '.[].ref') || exit 0
          for ref in $refs; do
            run=${ref#refs/heads/tm-scn/}
            run=${run%%/*}
            run=${run%%.*}
            if [ "$run" != "$RUN_ID" ]; then
              st=$(timeout 30 gh api "repos/$REPO/actions/runs/$run" --jq .status 2>/dev/null || echo unknown)
              case $st in completed | unknown) ;; *) continue ;; esac
            fi
            echo "deleting $ref"
            timeout 30 gh api -X DELETE "repos/$REPO/git/${ref}" >/dev/null || echo "::warning::could not delete $ref"
          done
