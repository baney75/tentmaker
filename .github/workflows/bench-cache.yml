# Bench workload: save and restore of a 256 MiB random blob (cache throughput). GitHub: actions/cache. Tentmaker: its colocated repo cache (scripts/bench/blob.sh).
# bench.yml runs it on GitHub's hosted runners (workflow_call, cold then warm
# with the same cache key) and test/scenarios/bench.sh runs the same file under
# Tentmaker as .tm-scn/wf.yml. Every timed step goes through
# scripts/bench/phase.sh so both sides are measured the same way.
name: bench-cache

on:
  # Checks mode plans only push and pull_request workflows. The bench pushes
  # its tm-scn/ branches with GITHUB_TOKEN, which never starts a GitHub run,
  # so this trigger is for Tentmaker alone.
  push:
    branches: ['tm-scn/**']
  workflow_call:
    inputs:
      key:
        description: cache key suffix, one per cold and warm pair
        type: string
        required: true

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/bench/phase.sh begin restore
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bench-blob
          key: bench-cache-${{ inputs.key }}
      - name: restore (Tentmaker)
        run: |
          scripts/bench/blob.sh restore
          scripts/bench/phase.sh end restore "$(scripts/bench/blob.sh hit)"
      - run: scripts/bench/blob.sh verify
      - run: scripts/bench/blob.sh make
      - run: scripts/bench/phase.sh begin save
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          path: ~/bench-blob
          key: bench-cache-${{ inputs.key }}
      - name: save (Tentmaker)
        run: scripts/bench/phase.sh end save "$(scripts/bench/blob.sh save)"
      - run: scripts/bench/phase.sh report
