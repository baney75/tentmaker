# Temporary: asks a real WFP engine which loopback conditions match.
name: wfp-probe
on:
  push:
    branches: [r2fix/mesh-win]
    paths: [internal/executor/windows/wfp_live_windows_test.go, .github/workflows/wfp-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: probe
        run: go test -tags live -count=1 -v -run TestWFPLoopbackConditionsLive ./internal/executor/windows/
